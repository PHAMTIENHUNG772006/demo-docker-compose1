version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  mysql-db:
    image: mysql:8.0
    container_name: hackathon_mysql
    environment:
      MYSQL_DATABASE: hackathon_db
      MYSQL_ROOT_PASSWORD: 1234$
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    restart: always

  # 2. Ứng dụng Spring Boot (Sử dụng Dockerfile đã tạo trước đó)
  app:
    build: .
    container_name: hackathon_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/hackathon_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234$
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - mysql-db
    networks:
      - app-network
    restart: always

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge